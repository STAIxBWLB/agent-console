name: Check
# Push runs only for main (protected-branch result); PRs run once via pull_request.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  # Only PR runs cancel each other: a main push run is the release gate's evidence and must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # check-docs resolves documentation stamps against history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm pack --dry-run --ignore-scripts

  # The one required check for main (#64): fails on any non-success gating result, skips and cancels included.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every gating job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gating results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "a gating job ended $r"; exit 1; }; done
          [ -n "$RESULTS" ]
