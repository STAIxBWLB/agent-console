name: Release

# Authoring this workflow does not create a tag or enable publication.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate on the tag commit
    runs-on: ubuntu-latest
    # The wait below has its own deadline (RELEASE_GATE_DEADLINE_S) inside this timeout.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Tag equals the package version, commit is on main, CHANGELOG entry is dated
        run: bun scripts/release-gate.ts check "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Wait for the tag commit's main CI to finish green
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GATE_DEADLINE_S: "1200"
        run: bun scripts/release-gate.ts wait-ci "$GITHUB_SHA"

  validate:
    needs: gate
    name: Release validation (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main"; exit 1; }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Documentation stamps are fresh at the tagged commit
        run: node scripts/check-docs.mjs --require-fresh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Require matching version, tag and dated changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) throw new Error('Tag must equal v + package.json version');
          if (execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== process.env.RELEASE_SHA) throw new Error('Checkout must match the triggering commit');
          const prefix = `## [${pkg.version}] - `;
          const headings = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          if (!headings.some(line => line.startsWith(prefix) && /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(line.slice(prefix.length)))) throw new Error('CHANGELOG needs a dated section for this version; Unreleased is insufficient');
          NODE
      - run: bun install --frozen-lockfile
      - name: Verify npm package dry-run
        run: npm pack --dry-run --ignore-scripts
      - name: Stage the npm tarball for validation
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { mkdirSync, readFileSync, renameSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const dir = join(process.env.RUNNER_TEMP, 'release-package');
          mkdirSync(dir);
          const packed = JSON.parse(execFileSync('npm', ['pack', '--json', '--ignore-scripts', '--pack-destination', dir], { encoding: 'utf8' }));
          if (packed.length !== 1) throw new Error('Expected exactly one package');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (packed[0].name !== pkg.name || packed[0].version !== pkg.version) throw new Error('Packed package identity differs');
          const filename = packed[0].filename;
          if (typeof filename !== 'string' || !/^[A-Za-z0-9._-]+\.tgz$/.test(filename)) throw new Error('Unexpected archive filename');
          renameSync(join(dir, filename), join(dir, 'package.tgz'));
          const sha256 = createHash('sha256').update(readFileSync(join(dir, 'package.tgz'))).digest('hex');
          writeFileSync(join(dir, 'manifest.json'), JSON.stringify({ name: pkg.name, version: pkg.version, tag: process.env.RELEASE_TAG, commit: process.env.RELEASE_SHA, sha256, distTag: pkg.version.includes('-') ? 'next' : 'latest' }) + '\n');
          NODE
      # check runs strict tsc, the boundary check, tests and a package dry-run.
      - run: bun run check
      - name: Smoke-test the staged tarball in a clean prefix
        run: |
          prefix="$RUNNER_TEMP/smoke"
          npm install -g --ignore-scripts --prefix "$prefix" "$RUNNER_TEMP/release-package/package.tgz"
          test "$("$prefix/bin/acon" --version)" = "$(node -p 'require("./package.json").version')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Linux'
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release-package/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved artifact with npm OIDC
    needs: validate
    # This variable is intentionally not configured by readiness work. Without it this job is skipped.
    if: github.repository == 'STAIxBWLB/agent-console' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/publish-package
      - name: Verify toolchain and artifact binding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { execFileSync } from 'node:child_process';
          const npm = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (Number(process.versions.node.split('.')[0]) < 24 || npm[0] < 11 || (npm[0] === 11 && (npm[1] < 5 || (npm[1] === 5 && npm[2] < 1)))) throw new Error('OIDC requires Node 24 and npm >=11.5.1 in this workflow');
          const dir = join(process.env.RUNNER_TEMP, 'publish-package');
          const manifest = JSON.parse(readFileSync(join(dir, 'manifest.json'), 'utf8'));
          const archive = join(dir, 'package.tgz');
          const sha256 = createHash('sha256').update(readFileSync(archive)).digest('hex');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const packed = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], { encoding: 'utf8' }));
          if (manifest.commit !== process.env.RELEASE_SHA || manifest.tag !== process.env.RELEASE_TAG || manifest.tag !== `v${pkg.version}` || manifest.sha256 !== sha256 || manifest.name !== pkg.name || manifest.version !== pkg.version || packed.name !== pkg.name || packed.version !== pkg.version) throw new Error('Artifact differs from the validated tag');
          const distTag = pkg.version.includes('-') ? 'next' : 'latest';
          if (manifest.distTag !== distTag) throw new Error('Unexpected npm dist-tag');
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${distTag}\n`);
          NODE
      - name: Publish the exact validated artifact
        run: npm publish "$RUNNER_TEMP/publish-package/package.tgz" --registry https://registry.npmjs.org --provenance --access public --tag "$NPM_DIST_TAG" --ignore-scripts


  image:
    name: Publish multi-arch image to GHCR
    needs: publish
    # Off unless the repository variable is set; npm publish must have succeeded first.
    if: github.repository == 'STAIxBWLB/agent-console' && vars.IMAGE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/staixbwlb/agent-console
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Version and tags from the validated package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          tags="$IMAGE:$version"
          case "$version" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          { echo "VERSION=$version"; echo "TAGS=$tags"; } >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push linux/amd64 and linux/arm64
        run: |
          args=()
          IFS=, read -ra list <<< "$TAGS"
          for t in "${list[@]}"; do args+=(--tag "$t"); done
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg OCI_REVISION="$GITHUB_SHA" --build-arg OCI_VERSION="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            "${args[@]}" .
      - name: Read the manifest back and run --version on amd64
        run: |
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > "$RUNNER_TEMP/manifest.json"
          node - "$RUNNER_TEMP/manifest.json" <<'NODE'
          const m = JSON.parse(require('node:fs').readFileSync(process.argv[2], 'utf8'));
          const have = (m.manifests ?? []).map((x) => `${x.platform?.os}/${x.platform?.architecture}`);
          for (const want of ['linux/amd64', 'linux/arm64']) if (!have.includes(want)) throw new Error(`manifest lacks ${want}: ${have.join(', ')}`);
          console.log(have.join(', '));
          NODE
          docker pull --platform linux/amd64 "$IMAGE:$VERSION"
          revision="$(docker image inspect --format "{{ index .Config.Labels \"org.opencontainers.image.revision\" }}" "$IMAGE:$VERSION")"
          test "$revision" = "$GITHUB_SHA"
          test "$(docker run --rm --platform linux/amd64 "$IMAGE:$VERSION" --version)" = "$VERSION"

  github-release:
    name: Publish the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets
      - name: Write release notes and name the validated assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, renameSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'release-assets');
          const manifest = JSON.parse(readFileSync(join(dir, 'manifest.json'), 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (manifest.tag !== process.env.RELEASE_TAG || manifest.commit !== process.env.RELEASE_SHA || manifest.version !== pkg.version) throw new Error('Artifact differs from the released tag');
          const lines = readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line.startsWith(`## [${pkg.version}] - `));
          if (start < 0) throw new Error('CHANGELOG has no section for this version');
          let end = lines.findIndex((line, i) => i > start && line.startsWith('## ['));
          if (end < 0) end = lines.length;
          const previous = end < lines.length ? /^## \[([^\]]+)\]/.exec(lines[end])?.[1] : undefined;
          const base = `${pkg.name.replace(/^@/, '').replace('/', '-')}-${pkg.version}`;
          renameSync(join(dir, 'package.tgz'), join(dir, `${base}.tgz`));
          renameSync(join(dir, 'manifest.json'), join(dir, `${base}.manifest.json`));
          const notes = [
            lines.slice(start + 1, end).join('\n').trim(), '',
            '## Install', '', '```', `npm i -g ${pkg.name}@${pkg.version}`, '```', '',
            `Published to npm with provenance through GitHub OIDC trusted publishing. The validated tarball (SHA-256 \`${manifest.sha256}\`) and its manifest (tag, commit, SHA-256) from this run are attached.`,
            ...(previous ? ['', `**Full changelog**: https://github.com/${process.env.GITHUB_REPOSITORY}/compare/v${previous}...${process.env.RELEASE_TAG}`] : []),
          ].join('\n');
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), notes + '\n');
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_ASSETS=${dir}/${base}\nRELEASE_PRERELEASE=${pkg.version.includes('-')}\n`);
          NODE
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Retry GitHub API calls on 5xx and 429 (#64): 4 attempts, 5/15/30 s backoff, inside the job timeout.
          retry() {
            local delays=(5 15 30) i out
            for i in 0 1 2 3; do
              if out="$("$@" 2>&1)"; then printf '%s\n' "$out"; return 0; fi
              printf '%s\n' "$out" >&2
              if [ "$i" -eq 3 ] || ! grep -Eq 'HTTP (5[0-9][0-9]|429)|(^|[^0-9])(5[0-9][0-9]|429)([^0-9]|$)|timeout|connection reset' <<<"$out"; then return 1; fi
              echo "retrying in ${delays[$i]}s" >&2; sleep "${delays[$i]}"
            done
          }
          notes="$RUNNER_TEMP/release-notes.md"
          flags=()
          if [ "$RELEASE_PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # Each attempt reconciles from the current state: a create that failed part way (release made, upload or
          # publish not) is finished by the idempotent upload --clobber + edit path on the next attempt.
          publish() {
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$RELEASE_ASSETS.tgz" "$RELEASE_ASSETS.manifest.json" --repo "$GITHUB_REPOSITORY" --clobber &&
                gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes" --draft=false --prerelease="$RELEASE_PRERELEASE"
            else
              gh release create "$RELEASE_TAG" "$RELEASE_ASSETS.tgz" "$RELEASE_ASSETS.manifest.json" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$notes" --verify-tag "${flags[@]}"
            fi
          }
          retry publish

  notify-site:
    name: Tell the family site to resync
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      # Only this job sees the token. Secrets cannot be tested in a step `if`; an unset secret maps to an empty string.
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: Send the product-release dispatch
        if: env.SITE_DISPATCH_TOKEN != ''
        # The site resync is best effort; it never fails a published release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.SITE_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh api repos/STAIxBWLB/agent-hub-site/dispatches -f event_type=product-release -f 'client_payload[product]=acon' -f "client_payload[tag]=$RELEASE_TAG"
